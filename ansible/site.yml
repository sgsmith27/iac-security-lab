---
# Solo analisis estatico. Las URLs son de ejemplo.
- name: Configurar aplicacion del laboratorio
  hosts: servidores
  become: true
  tasks:
    - name: Instalar nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Descargar configuracion verificada
      ansible.builtin.get_url:
        url: https://example.com/config.sh
        dest: /tmp/config.sh
        validate_certs: true
        mode: "0600"
        checksum: "sha256:{{ configuracion_sha256 }}"
      # Un uso real exige un hash obtenido de una fuente confiable.
      # No se ejecuta el archivo remoto descargado.

    - name: Consultar API interna
      ansible.builtin.uri:
        url: https://api.interna.local/registro
        validate_certs: true
        method: GET

    - name: Instalar archivo de configuracion
      ansible.builtin.copy:
        src: app.conf
        dest: /etc/app.conf
        owner: root
        group: root
        mode: "0644"
